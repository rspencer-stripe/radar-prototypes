<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar design</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', saved === 'dark' || saved === 'light' ? saved : 'auto');
  })();
</script>
</head>
<body>
  <main class="page">
    <div class="hero">
      <div class="hero-gradient" aria-hidden="true"></div>
      <div class="page-intro">
        <span class="go-link">go/radar/design</span>
        <div class="title-row">
          <h1>Radar design</h1>
          <div class="author-filter" id="author-filter">
            <button type="button" class="author-filter-btn" id="author-filter-btn" aria-haspopup="listbox" aria-expanded="false">
              <span id="author-filter-label">All</span>
              <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg>
            </button>
            <div class="author-filter-menu" id="author-filter-menu" hidden></div>
          </div>
        </div>
        <p>
          <span class="tone-dark">Prototypes, strategy docs and resources</span>
        </p>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-chips" id="filter-bar">
        <button class="filter-chip active" data-filter="All">All</button>
      </div>
      <button class="btn btn-primary" id="add-btn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
        <span>Add</span>
      </button>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>Nothing here yet.</p>
      <button class="btn btn-primary" id="empty-add-btn">Add your first item</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="table-wrap" id="table-wrap" hidden>
      <table class="proto-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Author</th>
            <th>Tag</th>
            <th>Added</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <div class="settings-dock" id="settings-dock">
    <button type="button" class="icon-btn settings-gear" id="settings-gear" aria-label="Display settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <div class="settings-panel" id="settings-panel" hidden>
      <div class="settings-section">
        <span class="settings-label">View</span>
        <div class="view-toggle" id="view-toggle">
          <button type="button" class="view-toggle-btn active" data-view="grid">Grid</button>
          <button type="button" class="view-toggle-btn" data-view="table">Table</button>
        </div>
      </div>

      <div class="settings-section" id="card-size-section">
        <span class="settings-label">Card size</span>
        <input type="range" id="card-size" min="180" max="420" step="4" value="248" aria-label="Card size" />
      </div>

      <div class="settings-section">
        <span class="settings-label">Authors</span>
        <div class="settings-list" id="authors-list"></div>
        <div class="settings-add-row">
          <input type="text" id="authors-add-input" placeholder="Add @handle…" />
          <button type="button" class="icon-btn" id="authors-add-btn" aria-label="Add author">+</button>
        </div>
      </div>

      <div class="settings-section">
        <span class="settings-label">Tags</span>
        <div class="settings-list" id="tags-list"></div>
        <div class="settings-add-row">
          <input type="text" id="tags-add-input" placeholder="Add tag…" />
          <button type="button" class="icon-btn" id="tags-add-btn" aria-label="Add tag">+</button>
        </div>
      </div>

      <div class="settings-section">
        <span class="settings-label">Theme</span>
        <div class="view-toggle" id="theme-toggle">
          <button type="button" class="view-toggle-btn" data-theme="light" aria-label="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button type="button" class="view-toggle-btn" data-theme="dark" aria-label="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button type="button" class="view-toggle-btn" data-theme="auto" aria-label="Auto">Auto</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add item</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="prototype-form">
        <input type="hidden" id="prototype-id" />

        <label class="field">
          <span class="field-label">Link</span>
          <input type="url" id="field-link" required placeholder="https://..." autofocus />
          <span class="field-hint" id="fetch-status"></span>
        </label>

        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" id="field-name" required placeholder="e.g. Radar rules builder v2" />
        </label>

        <label class="field">
          <span class="field-label">Author</span>
          <select id="field-author" required>
            <option value="" disabled selected>Select an author</option>
          </select>
        </label>

        <div class="field">
          <span class="field-label">Tag</span>
          <div class="tag-picker" id="tag-picker"></div>
          <input type="hidden" id="field-type" required />
        </div>

        <div class="field">
          <span class="field-label">Screenshot <span class="field-optional">(optional)</span></span>
          <input type="hidden" id="field-image" />

          <label class="upload-drop" id="upload-drop">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <span>Click to upload an image</span>
            <input type="file" id="field-upload" accept="image/*" hidden />
          </label>

          <div class="upload-filled" id="upload-filled" hidden>
            <div class="preview-thumb">
              <img id="preview-img" alt="Screenshot preview" />
            </div>
            <button type="button" class="upload-replace-link" id="upload-replace">Replace</button>
            <button type="button" class="upload-replace-link" id="upload-reload">Reload</button>
            <button type="button" class="upload-replace-link" id="upload-remove">Remove</button>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
