<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="hero">
      <div class="hero-gradient" aria-hidden="true"></div>
      <div class="page-intro">
        <h1>Radar Design</h1>
        <p>
          <span class="tone-dark">Prototypes, strategy docs, and resources</span>
          <span class="tone-muted">from the Radar design team.</span>
        </p>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-chips" id="filter-bar">
        <button class="filter-chip active" data-filter="All">All</button>
      </div>
      <button class="btn btn-primary" id="add-btn">+ Add</button>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>Nothing here yet.</p>
      <button class="btn btn-primary" id="empty-add-btn">Add your first item</button>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <div class="size-control" id="size-control">
    <span>Card size</span>
    <input type="range" id="card-size" min="220" max="420" step="10" value="260" aria-label="Card size" />
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add item</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="prototype-form">
        <input type="hidden" id="prototype-id" />

        <label class="field">
          <span class="field-label">Link</span>
          <input type="url" id="field-link" required placeholder="https://..." autofocus />
          <span class="field-hint" id="fetch-status"></span>
        </label>

        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" id="field-name" required placeholder="e.g. Radar rules builder v2" />
        </label>

        <label class="field">
          <span class="field-label">Description <span class="field-optional">(optional)</span></span>
          <textarea id="field-description" rows="3" placeholder="What is this?"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Author</span>
          <select id="field-author" required>
            <option value="" disabled selected>Select an author</option>
            <option value="Anne">Anne</option>
            <option value="Shelby">Shelby</option>
            <option value="Ryan">Ryan</option>
          </select>
        </label>

        <div class="field">
          <span class="field-label">Tag</span>
          <div class="tag-picker" id="tag-picker"></div>
          <input type="hidden" id="field-type" required />
        </div>

        <div class="field">
          <span class="field-label">Screenshot <span class="field-optional">(auto-filled, or upload your own)</span></span>
          <input type="hidden" id="field-image" />

          <label class="upload-drop" id="upload-drop">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <span>Click to upload an image</span>
            <input type="file" id="field-upload" accept="image/*" hidden />
          </label>

          <div class="upload-filled" id="upload-filled" hidden>
            <div class="preview-thumb">
              <img id="preview-img" alt="Screenshot preview" />
            </div>
            <div class="upload-filled-actions">
              <button type="button" class="btn btn-secondary" id="upload-replace">Replace</button>
              <button type="button" class="btn btn-secondary" id="upload-remove">Remove</button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
