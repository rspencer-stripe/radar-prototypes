<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="hero">
      <div class="hero-gradient" aria-hidden="true"></div>
      <div class="page-intro">
        <h1>Radar Design</h1>
        <p>
          <span class="tone-dark">Prototypes, strategy docs, and resources</span>
          <span class="tone-muted">from the Radar design team.</span>
        </p>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-chips" id="filter-bar">
        <button class="filter-chip active" data-filter="All">All</button>
      </div>
      <button class="btn btn-primary" id="add-btn">Add item</button>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>Nothing here yet.</p>
      <button class="btn btn-primary" id="empty-add-btn">Add your first item</button>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add item</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="prototype-form">
        <input type="hidden" id="prototype-id" />

        <label class="field">
          <span class="field-label">Link</span>
          <input type="url" id="field-link" required placeholder="https://..." autofocus />
          <span class="field-hint" id="fetch-status"></span>
        </label>

        <div class="preview-thumb" id="preview-thumb" hidden>
          <img id="preview-img" alt="Screenshot preview" />
        </div>

        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" id="field-name" required placeholder="e.g. Radar rules builder v2" />
        </label>

        <label class="field">
          <span class="field-label">Description <span class="field-optional">(optional)</span></span>
          <textarea id="field-description" rows="3" placeholder="What is this?"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Author</span>
          <select id="field-author" required>
            <option value="" disabled selected>Select an author</option>
            <option value="Anne">Anne</option>
            <option value="Shelby">Shelby</option>
            <option value="Ryan">Ryan</option>
          </select>
        </label>

        <div class="field">
          <span class="field-label">Tag</span>
          <div class="tag-picker" id="tag-picker"></div>
          <input type="hidden" id="field-type" required />
        </div>

        <label class="field">
          <span class="field-label">Screenshot URL <span class="field-optional">(auto-filled, editable)</span></span>
          <input type="url" id="field-image" placeholder="https://..." />
        </label>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
